<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz</title>
<style>
:root{--bg:#fff7fb;--card:#fff;--tx:#2a1a2e;--mut:#8a7690;--ac:#e1306c;--ac2:#833ab4;--bd:#f0d9e6}
@media (prefers-color-scheme:dark){:root{--bg:#150d1a;--card:#221529;--tx:#fbeff7;--mut:#b39bbb;--bd:#3a2444}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:18px 16px 40px}
.bar{height:6px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .4s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:22px 18px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.n{font-size:12px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:21px;line-height:1.3;margin:0 0 16px}
.q img{width:100%;height:auto;object-fit:contain;border-radius:12px;margin:0 0 16px;display:block}
.o{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.o:active{transform:scale(.98)}
.o.s{border-color:var(--ac);background:linear-gradient(135deg,rgba(131,58,180,.14),rgba(225,48,108,.14))}
.b{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--ac2),var(--ac));cursor:pointer;margin-top:6px}
.b.g{background:transparent;color:var(--tx);border:1.5px solid var(--bd)}
.b:disabled{opacity:.4}
textarea{width:100%;min-height:90px;font:inherit;color:inherit;background:transparent;border:1.5px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;resize:vertical}
.h{font-size:13px;color:var(--mut);margin:-6px 0 12px}
.r{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.r label{flex:1}.r input{max-width:150px;font-size:12px}
.r img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:var(--bd)}
</style></head><body>

const A={};let order=[];
const app=document.getElementById('app'),bar=document.getElementById('p');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function next(from,pick){
  const q=Q[from];
  if(q.skip&&q.skip[pick]==="end17")return show(16);
  if(from===15||from===16)return done();
  show(from+1);
}
function show(n){
  order.push(n);const q=Q[n];
  bar.style.width=Math.min(94,(n/15)*100)+'%';
  let h='<div class="card q"><div class="n">Pergunta</div><h1>'+esc(q.t)+'</h1>';
  if(q.h)h+='<div class="h">'+esc(q.h)+'</div>';
  if(q.img&&IMG[q.img])h+='<img src="'+IMG[q.img]+'" alt="">';
  if(q.type==="text"){
    h+='<textarea id="tx" placeholder="Escreve aqui (opcional)..."></textarea><button class="b" id="go">Continuar</button>';
  }else if(q.type==="multi"){
    q.o.forEach((o,k)=>{if(k===6&&!A[12])return;h+='<button class="o" data-k="'+k+'">'+esc(o)+'</button>'});
    h+='<button class="b" id="go" disabled>Continuar</button>';
  }else q.o.forEach((o,k)=>h+='<button class="o" data-k="'+k+'">'+esc(o)+'</button>');
  app.innerHTML=h+'</div>';
  if(q.type==="text"){
    document.getElementById('go').onclick=()=>{A[n]=document.getElementById('tx').value.trim();next(n,0)};
  }else if(q.type==="multi"){
    const sel=new Set(),go=document.getElementById('go');
    app.querySelectorAll('.o').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k;
      if(sel.has(k)){sel.delete(k);b.classList.remove('s')}
      else if(sel.size<2){sel.add(k);b.classList.add('s')}
      go.disabled=sel.size===0;
    });
    go.onclick=()=>{A[n]=[...sel].map(k=>k===6?"A ideia que digitei: "+A[12]:q.o[k]).join(" + ");next(n,0)};
  }else app.querySelectorAll('.o').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;b.classList.add('s');A[n]=q.o[k];
    setTimeout(()=>next(n,k),320);
  });
  window.scrollTo(0,0);
}
function done(){
  bar.style.width='100%';
  let s="";
  order.forEach(n=>{if(A[n]!==undefined&&A[n]!=="")s+=(n+1)+". "+Q[n].t.replace(/\s+/g,' ')+"\n-> "+A[n]+"\n\n"});
  app.innerHTML='<div class="card"><h1>Prontinho!</h1><div class="h" id="st">'+(BUILD?'Modo teste: nada foi enviado.':'Enviando suas respostas...')+'</div><textarea id="sm" readonly style="min-height:150px;display:none">'+esc(s)+'</textarea><button class="b g" id="cp" style="display:none">Copiar respostas</button></div>';
  const st=document.getElementById('st'),t=document.getElementById('sm'),cp=document.getElementById('cp');
  if(BUILD)return;
  fetch('https://formsubmit.co/ajax/'+EMAIL,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({_subject:'Respostas do quiz',_captcha:'false',respostas:s})})
  .then(r=>{if(!r.ok)throw 0;st.textContent='Respostas enviadas, obrigado!'})
  .catch(()=>{st.textContent='Não consegui enviar automático. Copia e cola na DM:';t.style.display='block';cp.style.display='block';
    cp.onclick=()=>{t.select();try{navigator.clipboard.writeText(s)}catch(e){document.execCommand('copy')}cp.textContent='Copiado'}});
}
/* ---- Modo montagem ---- */
const SL=[[1,2],[2,4],[3,8],[4,9],[5,10],[6,11],[7,12],[8,13]];
function small(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,1100/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  res(c.toDataURL('image/jpeg',.87))};im.src=r.result};r.readAsDataURL(file)})}
function builder(){
  let h='<div class="card"><h1>Montar o quiz</h1><div class="h">Escolha a foto de cada anexo. Elas entram inteiras, sem cortes. Depois é só testar e baixar o quiz pronto.</div>';
  SL.forEach(([a,q])=>h+='<div class="r"><img id="pv'+a+'" alt=""><label>Anexo '+a+'<br><small>pergunta '+q+'</small></label><input type="file" accept="image/*" data-a="'+a+'"></div>');
  h+='<button class="b" id="tst">Testar quiz</button><button class="b g" id="dl">Baixar quiz pronto (.html)</button></div>';
  app.innerHTML=h;
  app.querySelectorAll('input[type=file]').forEach(f=>f.onchange=async()=>{
    if(!f.files[0])return;const a=f.dataset.a,d=await small(f.files[0]);IMG[a]=d;document.getElementById('pv'+a).src=d});
  document.getElementById('tst').onclick=()=>{order=[];show(0)};
  document.getElementById('dl').onclick=()=>{
    const cl=document.documentElement.cloneNode(true);
    cl.querySelector('#app').innerHTML='';cl.querySelector('#p').removeAttribute('style');
    const sc=cl.querySelector('script');
    sc.textContent=sc.textContent
      .replace(/\/\*I\*\/[\s\S]*?\/\*E\*\//,()=>'/*I*/'+JSON.stringify(IMG)+'/*E*/')
      .replace(/\/\*B\*\/true\/\*BE\*\//,()=>'/*B*/false/*BE*/');
    const blob=new Blob(['<!DOCTYPE html>\n'+cl.outerHTML],{type:'text/html'});
    const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='quiz-pronto.html';l.click();
  };
}
BUILD?builder():show(0);
</script>
